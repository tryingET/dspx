# Project configuration for DSPy + Codex Exec + MLflow

[mlflow]
# Enable/disable autolog (set to false to disable)
enable = true
# Point to your MLflow server (e.g., Synology NAS Docker)
# Example with host-port 50000 mapping to container 5000:
tracking_uri = "http://100.106.114.10:50000"
experiment = "DSPy"

[codex]
# Default Codex Exec model and behavior
model = "gpt-5"
reasoning_effort = "minimal"
bypass = true  # maps to --dangerously-bypass-approvals-and-sandbox
search = false  # codex web_search optional; using DSPy tools instead

[provider]
# Select the LM provider via registry (default: codex-exec)
name = "codex-exec"
