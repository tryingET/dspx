# Project configuration for DSPx (example)
#
# How to use
# - Copy this file to ./config.toml and edit as needed:
#     cp example.toml config.toml
# - Or set DSPX_CONFIG to point at your config path:
#     export DSPX_CONFIG=/abs/path/to/config.toml
# - The loader searches for the nearest ./config.toml if DSPX_CONFIG is unset.
#
# Notes
# - MLflow settings enable experiment tracking when MLFLOW_ENABLE is truthy.
# - Provider selection controls which LM implementation backs DSPy.
# - Per‑service time budgets are provided via environment variables
#   (DSPX_BUDGET_SIGNATURE_MS, DSPX_BUDGET_MODULE_MS, DSPX_BUDGET_CODEGEN_MS)
#   and are recorded as tags/metrics when MLflow is enabled.

[mlflow]
# Turn MLflow logging on/off (true/false)
enable = true

# MLflow server URI (change to your deployment)
# Example: host port 50000 → container 5000
tracking_uri = "http://127.0.0.1:5000"

# Experiment name
experiment = "DSPy"

[codex]
# Codex Exec defaults (used when provider name is "codex-exec")
model = "gpt-5"
reasoning_effort = "minimal"
# When true, Codex is launched with --dangerously-bypass-approvals-and-sandbox
bypass = true
# Optional: enable Codex web_search flag
search = false

[provider]
# Select the LM provider via registry name
# Options include: "codex-exec", "openrouter", "claude-cli", "gemini-cli", "multi", "stub"
name = "codex-exec"

# OpenRouter (API provider)
# Notes:
# - Do NOT put `OPENROUTER_API_KEY` in this file; set it as an env var (CI secret).
# - These values are optional; env vars win if set.
[openrouter]
base_url = "https://openrouter.ai/api/v1"
model = "meta-llama/llama-3.1-8b-instruct:free"
timeout_s = 30
# Optional attribution (recommended by OpenRouter docs)
http_referer = ""
app_title = "dspx"

# API key must come from env (recommended: put it in .env, which is git-ignored)
#   OPENROUTER_API_KEY=...

# --- Optional: reference for env-based budgets/timeouts ---
# (not read from TOML; set them as env vars alongside this config)
#   export DSPX_BUDGET_SIGNATURE_MS=30000
#   export DSPX_BUDGET_MODULE_MS=10000
#   export DSPX_BUDGET_CODEGEN_MS=60000
# Provider timeouts (best-effort clamps during runs):
#   export CODEX_TIMEOUT=30
#   export CLAUDE_TIMEOUT=30
#   export GEMINI_TIMEOUT=30
