# Example DSPx mixed-provider runtime profile (v4)
# Verified locally on 2026-03-22.

[lm_auth]
model = "codex/gpt-5.4"
auth_provider = "codex"
auth_storage = "~/.pi/agent/auth.json"
timeout_s = 60

# Autonomous-foundry role declarations. A configured role is not considered
# live-verified until its receipt-backed call succeeds.
[model_roles.quality_criteria]
model = "codex/gpt-5.6-sol"
reasoning_effort = "high"

[model_roles.oracle_semantic]
# Luna remains the preferred role target. The backend/provider below selects
# the explicit executable route; receipts preserve preferred versus executed.
model = "codex/gpt-5.6-luna"
reasoning_effort = "max"
backend = "live"
provider = "dspy-lm-auth"
# For deterministic offline development instead:
# backend = "fixture-replay"
# fixture_path = "./fixtures/oracle-semantic.json"

[vllm]
api_base = "http://127.0.0.1:1234/v1"
model = "Qwen/Qwen3.5-27B"
timeout_s = 120
json_mode = false

[optimize]
student_provider = "vllm-local"
reflection_provider = "dspy-lm-auth"

[provider]
name = "vllm-local"
