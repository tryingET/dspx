[tool.uv.workspace]
members = ["packages/dspx-core", "apps/forge"]

[tool.uv]
# Immutable dependency-evidence cutoff for the exact DSPy 3.3 transaction.
exclude-newer = "2026-08-04T23:59:59Z"
# DSPy 3.3.0 pins GEPA 0.1.1 transitively. DSPx explicitly overrides that
# stale compatibility pin only after its GEPA 0.1.4 transition matrix passes.
override-dependencies = ["gepa[dspy]==0.1.4"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "ty>=0.0.11",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.6.0",
]

[tool.pytest.ini_options]
markers = [
  "forge: forge-app and forge/core boundary focused tests",
  "slow: long-running or oversized test modules excluded from opt-in fast parallel runs",
  "live: opt-in tests that require external services, network, live model providers, or local authenticated CLIs",
  "network: tests that may call external network services",
  "model: tests that may invoke live LLM/model provider runtimes",
  "gpu: tests that require GPU resources",
  "postgres: tests that require a live Postgres/pgvector service",
]
filterwarnings = [
  # Silence upstream MLflow/protobuf deprecation warning during tests
  "ignore:.*label\\(\\) is deprecated.*:DeprecationWarning:mlflow\\.store\\.tracking\\.rest_store",
]

[tool.ruff]
extend-exclude = ["examples/workflows/**"]

[tool.coverage.run]
branch = true
source = ["dspx", "dspx_forge"]

[tool.coverage.report]
# Measured against the complete offline shard set on 2026-07-10. Keep this a
# brownfield ratchet: raise it only after a new full measurement, never by guess.
fail_under = 64
show_missing = true
skip_covered = true

[tool.ty.src]
exclude = ["examples/workflows/**"]
