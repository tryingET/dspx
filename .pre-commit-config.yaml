repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff-format
        files: ^(packages|apps|tests|scripts)/.*\.py$
      - id: ruff
        args: [--fix]
        files: ^(packages|apps|tests|scripts)/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(AGENTS\.md|CONTRIBUTING\.md|README\.md|next_session_prompt\.md|Justfile|\.pre-commit-config\.yaml|\.gitignore|docs/project/(developer_workflow|mission|tactical_goals)\.md|docs/tech-stack\.local\.md|governance/.*|diary/.*|scripts/.*|packages/.*\.py|apps/.*\.py|tests/.*\.py)$
      - id: end-of-file-fixer
        files: ^(AGENTS\.md|CONTRIBUTING\.md|README\.md|next_session_prompt\.md|Justfile|\.pre-commit-config\.yaml|\.gitignore|docs/project/(developer_workflow|mission|tactical_goals)\.md|docs/tech-stack\.local\.md|governance/.*|diary/.*|scripts/.*|packages/.*\.py|apps/.*\.py|tests/.*\.py)$
      - id: check-merge-conflict
        files: ^(AGENTS\.md|CONTRIBUTING\.md|README\.md|next_session_prompt\.md|Justfile|\.pre-commit-config\.yaml|\.gitignore|docs/project/(developer_workflow|mission|tactical_goals)\.md|docs/tech-stack\.local\.md|governance/.*|diary/.*|scripts/.*|packages/.*\.py|apps/.*\.py|tests/.*\.py)$

  - repo: local
    hooks:
      - id: verify-full
        name: just verify-full
        entry: just verify-full
        language: system
        pass_filenames: false
        stages: [pre-push]
