repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (uv)
        entry: uvx ruff format --force-exclude
        language: system
        types: [python]
        pass_filenames: true
        exclude: ^examples/
        stages: [pre-commit]
      - id: ruff-check
        name: ruff check (uv)
        entry: uvx ruff check --force-exclude
        language: system
        types: [python]
        pass_filenames: true
        exclude: ^examples/
        stages: [pre-commit]
      - id: ty
        name: ty (uvx)
        entry: uvx ty check packages/dspx-core/src apps/forge/src
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]
      - id: whitespace
        name: whitespace check (git)
        entry: bash -lc 'git diff --check --cached'
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: verify-pre-push
        name: verify pre-push (monorepo+typecheck+test)
        entry: bash -lc 'just monorepo-check && just typecheck && just test'
        language: system
        pass_filenames: false
        stages: [pre-push]

default_stages: [pre-commit]
