      {
        "schema_version": 1,
        "canonical_artifacts": [
          {
            "artifact_family": "canonical",
            "space": "Wiki",
            "path": "Wiki/Close Reading.md",
            "title": "Close Reading",
            "state": "accepted"
          }
        ]
      }
    declared_output_root: "transition/pdf-transition-demo"
