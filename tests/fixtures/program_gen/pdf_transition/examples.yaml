    marker_markdown: |
      # Five Levels of Close Reading

      Close reading is not just copying sentences. A reader first paraphrases the passage in plain language, then identifies the main thesis, then explains the logic that connects claims and examples.

      The reader should also evaluate the limits of the passage and state where the idea can be applied. These stages make interpretation reviewable before it becomes a permanent note.
