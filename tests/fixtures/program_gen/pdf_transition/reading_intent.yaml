{
  "schema_version": "program-intent-v2",
  "name": "SyntheticPurposeReading",
  "objective": "Produce noncanonical synthetic reading candidates guided by the supplied full owner-reviewed working intent, not by author purpose. Preserve source meaning and exact evidence; never invent missing support. Map the whole source, select parts and counterevidence, and synthesize parts back into the whole. Explicit original Paul/Elder L1 paraphrase, L2 explication with main point/elaboration/example/analogy, L3 analysis of purpose/question/information/concepts/assumptions/inferences/implications/viewpoint, L4 evaluation of clarity/accuracy/precision/relevance/depth/breadth/logic/significance/fairness, L5 labeled author-perspective simulation, plus our added L6 application/limits/counterexample/observable test. Missing support is insufficient_evidence, never manufactured quotation. All dependent rows bind request_id, source_sha256 and reading_intent_binding. No canonical apply, Oracle invocation, indexing, semantic analysis or publication.",
  "input_fields": [
    {"name": "source_package_manifest_json", "type": "str", "desc": "Caller-supplied synthetic source snapshot with source_ref and exact markdown_sha256; this is evidence identity, not reader purpose."},
    {"name": "marker_markdown", "type": "str", "desc": "Exact supplied synthetic source text. Keep facts stable across reader-purpose changes; cite exact Unicode character ranges and UTF-8 excerpt hashes."},
    {"name": "existing_wiki_index_json", "type": "str", "desc": "Explicit empty synthetic wiki snapshot. Do not open paths or invent existing notes."},
    {"name": "declared_output_root", "type": "str", "desc": "Logical synthetic-review-only destination, never filesystem authority."},
    {"name": "puzzle_set_snapshot_json", "type": "str", "desc": "Caller-supplied synthetic existing puzzle IDs/questions; no registration or invented puzzle membership."},
    {"name": "working_reading_intent_json", "type": "str", "desc": "FULL Obsidian working-reading-intent-v1 owner-reviewed generation, including reader_purpose, mode, selected puzzle, revision and hash. Steer selected evidence, critique, application and note contents by this purpose; do not change source facts."},
    {"name": "reading_intent_binding_json", "type": "str", "desc": "Independent intent_id/revision/hash identity. Echo exactly at family, plan, paragraph, synthesis, note, campaign and downstream rows; echoes are not execution proof."},
    {"name": "producer_context_json", "type": "str", "desc": "Independent request_id, source_sha256 and puzzle_snapshot_sha256; bind all dependent generated content to this request and source."}
  ],
  "output_fields": [
    {"name": "section_units_json", "type": "str", "desc": "Nonempty source section rows with unique section_id and exact evidence: source_ref, markdown_sha256, start/end character offsets, excerpt, excerpt_sha256, quotation_status=exact, page/section/paragraph. Or explicit insufficient_evidence with reason. Family and rows carry request/source/intent binding and canonical_mutation_performed=false."},
    {"name": "distillation_frames_json", "type": "str", "desc": "Nonempty bound frame rows referencing section_id. Preserve purpose_in_source separately, whole_map, selected_parts, whole_synthesis, counterevidence and its exact contrary_evidence locator. Explicit levels L1-L6 each include content, evidence, request/source/intent binding, and operations object. L1 operations: paraphrase. L2: main_point, elaboration, example, analogy, example_origin. L3: purpose, question, information, concepts, assumptions, inferences, implications, point_of_view. L4: clarity, accuracy, precision, relevance, depth, breadth, logic, significance, fairness. L5: question, simulated_answer, uncertainty, with simulation=true. L6: application, limits, counterexample, observable_test, recipient, uncertainty, with added_extension=true. A level may instead explicitly declare status=insufficient_evidence and reason. State uncertainty and limits, not semantic success."},
    {"name": "evidence_cards_json", "type": "str", "desc": "Nonempty bound evidence rows with section_id and exact evidence or explicit insufficient_evidence; retain contrary evidence and uncertainty. canonical_mutation_performed=false."},
    {"name": "merge_create_proposals_json", "type": "str", "desc": "Nonempty purpose-sensitive noncanonical proposal rows with section_id, evidence and request/source/intent binding; no canonical approval or apply."},
    {"name": "review_packet_json", "type": "str", "desc": "Bound review family with canonical_mutation_performed=false and nested note_campaign_review_packet: schema_version=mobile-note-campaign-review-packet-v2, artifact_type=note_campaign_review_packet, packet_state=generated. raw_artifact_views contains nonempty candidate_notes(title,markdown), campaign_rows(candidate_name,recommended_next_step), and explicit downstream object. All packet and dependent rows carry exact request/source/intent bindings. Never manufacture missing content after execution."},
    {"name": "artifact_contract_manifest_json", "type": "str", "desc": "Nonempty bound artifact contract rows referencing section_id and evidence; all eight output families required and local synthetic only. No review eligibility or canonical mutation."},
    {"name": "frontmatter_plans_json", "type": "str", "desc": "Nonempty bound source-qualified candidate frontmatter plans with section_id and evidence; reader purpose, author purpose, critique and proposal remain separate. No primary puzzle authority."},
    {"name": "wiki_note_drafts_json", "type": "str", "desc": "Nonempty bound reviewable note draft rows with title, markdown, section_id and evidence. Substantive purpose-sensitive synthetic content only; canonical_mutation_performed=false."}
  ],
  "options": {"focused_json_bundle_runtime": false, "module_inference": false}
}
