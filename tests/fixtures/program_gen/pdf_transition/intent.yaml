schema_version: program-intent-v2
name: PdfTransitionProgram
objective: >-
  Transform raw PDF/Marker markdown plus source-package context into source-grounded,
  reviewable Obsidian Wiki transition artifacts and language-consistent Wiki note
  draft previews with ontologically separated frontmatter roles: section-unit
  candidates, close-reading distillation frames, evidence cards, merge/create
  proposals, typed frontmatter plans, footnoted wikilinked note drafts, review
  packets, and an artifact contract manifest.
task_type: single_module
inputs:
  - source_package_manifest_json
  - marker_markdown
  - existing_wiki_index_json
  - declared_output_root
outputs:
  - section_units_json
  - distillation_frames_json
  - evidence_cards_json
  - merge_create_proposals_json
  - frontmatter_plans_json
  - wiki_note_drafts_json
  - review_packet_json
  - artifact_contract_manifest_json
input_fields:
  - name: source_package_manifest_json
    type: str
    desc: JSON source-package manifest derived from Zotero/Marker package authority, including source language, doc_id/package paths, authors/creators when available, item_key/citekey, attachment_record_id, and Zotero item/attachment refs when available. When explicit Zotero URIs are absent, the generated program should derive review links from item_key and attachment_record_id without changing source identity.
  - name: marker_markdown
    type: str
    desc: Raw Marker markdown or section text from a PDF-like source artifact.
  - name: existing_wiki_index_json
    type: str
    desc: Read-only summary of existing canonical Wiki/Atlas candidates for merge-before-create decisions.
  - name: declared_output_root
    type: str
    desc: Declared transition artifact root; generated program outputs describe artifacts for this root but must not mutate Wiki notes.
output_fields:
  - name: section_units_json
    type: str
    desc: JSON array of transition-family section-unit candidates with source references.
  - name: distillation_frames_json
    type: str
    desc: JSON array of close-reading distillation frames containing paraphrase, thesis, logic, evaluation, and application fields.
  - name: evidence_cards_json
    type: str
    desc: JSON array of source-grounded transition-family evidence cards.
  - name: merge_create_proposals_json
    type: str
    desc: JSON array of proposal-family merge/create candidates; proposals only, not canonical note writes.
  - name: frontmatter_plans_json
    type: str
    desc: JSON object separating review artifact frontmatter, proposed canonical note frontmatter, and source/work frontmatter candidates. It must choose note kind from content role and source material type without collapsing review status, source identity, and canonical note identity into one blob.
  - name: wiki_note_drafts_json
    type: str
    desc: JSON array of review-only Wiki note draft previews with source-language text, wikilinked key concepts, and footnote-only source/Zotero provenance.
  - name: review_packet_json
    type: str
    desc: JSON review-family packet summarizing confidence, uncertainty, provenance, draft quality, and review needs.
  - name: artifact_contract_manifest_json
    type: str
    desc: JSON manifest declaring source/transition/proposal/review/draft/canonical artifact families and forbidden effects.
examples_path: examples.yaml
metric: exact_match
constraints:
  - Treat Zotero/source package metadata as source identity authority; do not invent or mutate source identity.
  - Treat Marker markdown as extraction/source artifact input; do not claim Marker extraction authority.
  - Detect and preserve the dominant source language; when the supplied source text is English, all generated draft note prose, headings, labels, and review-facing text should be English unless quoting non-English source text.
  - Section units, distillation frames, and evidence cards are transition artifacts only.
  - Merge/create outputs are proposal artifacts only and must include review_required when targeting Wiki or Atlas.
  - Wiki note drafts are preview artifacts only; they must not claim accepted canonical status or write files.
  - "Separate ontological roles: review artifact metadata belongs to review_artifact_frontmatter, proposed Wiki/Atlas note identity belongs to proposed_note_frontmatter, and Zotero/source-work identity belongs to source_work_frontmatter; do not merge them into one ambiguous frontmatter blob."
  - "Select proposed note kind from the role of the content, not from file format alone: concept, framework, method, scenario, source, project, log, reflection, lesson-asset, person, or board. A PDF source may yield a source/work note plus multiple concept/method/framework notes."
  - "Preserve source material type separately as source_material_type or work_type, such as guide, book, paper, article, report, chapter, transcript, webpage, or unknown; do not confuse source type with target note kind."
  - "Proposed canonical note frontmatter should follow the vault target core where applicable: space, domain, kind, state, confidence, and needs_review, plus source_ids/citekeys/doc_ids when source-derived. When source authors/creators are present, include them as Obsidian author wikilinks in source_authors (for example [[Richard Paul]]), without replacing citekeys or source_ids."
  - "Source/work frontmatter candidates should follow the work-note contract when enough metadata is present: space=atlas, kind=source, state=reference, work_id, title, authors, year, primary_source_id, source_ids, citekeys, confidence, needs_review. Authors should be emitted as Obsidian wikilinks when creator names are known."
  - Wiki note drafts must use Obsidian wikilinks for durable key concepts, methods, frameworks, and sibling candidate notes, while avoiding overlinking ordinary words.
  - Wiki note draft source provenance must be carried in footnotes or footnote_refs, not in a separate source/provenance heading block.
  - Footnotes must prefer Zotero item/attachment links or refs when present, derive Zotero item/PDF links from item_key and zotero-attachment attachment_record_id when explicit URI fields are absent, and include citekey/page/section/marker references plus exact or explicitly approximate quotes.
  - "Preserve package-folder semantics: package roots are doc_id/hash keyed (for example packages/doc:a6112bfb), while Zotero item keys/citekeys remain source identity metadata inside the manifest and footnotes."
  - Review packets are review artifacts only and do not approve canonicalization.
  - Canonical Wiki or Atlas artifacts may be mentioned as targets but must not be created, overwritten, accepted, or mutated.
  - Preserve source_refs/provenance on every transition, proposal, evidence, draft, or review artifact.
  - Explain confidence, uncertainty, source-grounding gaps, language decisions, and review needs explicitly.
  - "Use the How to Read a Paragraph close-reading rubric as program-quality guidance: generated artifacts should expose reading purpose, authorial purpose, document/argument structure, elements of thought, paragraph-scale evidence linkage, source-grounding uncertainty, and puzzle-fit/merge-before-create rationale where inferable."
  - "Purpose framing: each proposed note or section should say what work/reading purpose it serves, not only summarize source text."
  - "Authorial-purpose and structural reading: infer why the author wrote the section and preserve the section's role in the source's argument or method."
  - "Metacognitive uncertainty: distinguish verified source-grounded claims from inferred interpretation, review needs, and weak evidence."
  - "Use all How to Read a Paragraph concept outputs as an enrichment rubric, not as automatically accepted notes: Purpose-Driven Reading, Authorial Purpose in Reading, Map of Knowledge, Reflective Reading, Metacognitive Reading, Elements of Thought, Five Levels of Close Reading, Structural Reading, How to Read a Paragraph, Reading Within Disciplines, Active Annotation, and Analyzing the Logic of an Article."
  - "For each generated artifact, enrich value by making the relevant How-to-Read concept role explicit when inferable: purpose, authorial intent, knowledge-map placement, reflective question, metacognitive uncertainty, elements-of-thought structure, close-reading depth, structural location, paragraph-level evidence, disciplinary context, annotation/action, and article-logic analysis."
  - "Do not force every How-to-Read concept onto every source section; choose the relevant concepts and explain absent or weak concepts as review uncertainty."
  - External filesystem mutation is forbidden except for declared DSPx program-gen output artifacts.
jury:
  selection_model: perspective_balanced_explicit_pool
  minimum_jurors: 12
  perspectives:
    - source_grounding
    - authority_boundaries
    - transition_artifact_quality
    - language_fidelity
    - zotero_footnote_linkage
    - zotero_identity_derivation
    - ontological_role_separation
    - wiki_link_key_concepts
    - purpose_framing
    - authorial_purpose_and_structure
    - metacognitive_uncertainty
    - how_to_read_concept_enrichment
promotion:
  adjudicator:
    kind: ai_agent
    id: dspx_program_adjudicator_v1
  external_authority:
    refs:
      - system: obsidian_wiki_review_queue
        ref: review-required-no-canonical-mutation
        role: optional_review_target_not_applied
options:
  scenario_name: pdf-transition-program-gen
  primary_architecture: /home/tryinget/Documents/Obsidian/_System/architecture/pdf-transition-architecture.md
  related_architectures:
    - /home/tryinget/Documents/Obsidian/_System/architecture/distillation-method-architecture.md
    - /home/tryinget/Documents/Obsidian/_System/architecture/source-semantic-scaffold-architecture.md
    - /home/tryinget/Documents/Obsidian/_System/pdf-pipeline/workflow-profiles.md
    - /home/tryinget/Documents/Obsidian/_System/architecture/merge-before-create-architecture.md
    - /home/tryinget/Documents/Obsidian/_System/architecture/atlas-access-policy.md
  refinement_source:
    source_run: /tmp/dspx-how-to-read-run.DTXiRz/runtime
    review_packet: /home/tryinget/Documents/Obsidian/_System/review/proposals/pdf-transition/doc:a6112bfb/dspy-review-packet.md
    all_12_review_seed_receipt: /home/tryinget/Documents/Obsidian/_System/review/proposals/pdf-transition/doc:a6112bfb/canonical-apply-receipt.all-12.json
  authority_model:
    source: raw extraction/source package artifact
    transition: section units, distillation frames, and evidence cards
    proposal: merge/create candidates
    frontmatter_plan: separated review artifact, proposed note, and source/work frontmatter candidates
    draft: footnoted wikilinked Wiki note previews for review only
    review: review packet
    canonical: Wiki/Atlas note only after explicit review/apply outside program-gen
  expected_artifact_family:
    - section-unit candidates
    - distillation frames
    - evidence cards
    - merge/create proposals
    - language-consistent Wiki note draft previews
    - Zotero/source footnotes
    - derived Zotero item/PDF links from manifest keys when explicit URI fields are absent
    - role-separated frontmatter plans for review artifacts, proposed notes, and source/work candidates
    - source-material-type-aware note kind selection
    - wikilinked key concept candidates
    - review packets
    - replay/receipt metadata
    - artifact contract manifest
  forbidden_effects:
    - canonical Wiki mutation
    - final acceptance
    - Atlas/Wiki authority decision without review
    - Zotero/source identity authority mutation
    - Marker extraction authority
    - source-language translation unless explicitly requested
    - separate source/provenance heading block inside note drafts
    - package folder rename to Zotero key or citekey
    - collapsing review artifact status, canonical note identity, and source/work identity into one ambiguous frontmatter block
    - external filesystem mutation beyond declared DSPx output artifacts
    - promotion from proposal to accepted note
