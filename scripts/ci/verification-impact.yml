schema_version: dspx-verification-impact-map-v1
thresholds:
  max_changed_files_before_wide: 20
  max_impact_groups_before_wide: 3
rules:
  - match: "docs/*.md"
    category: docs
    impact_group: docs
    risk: docs_only
    commands:
      - docs_strict

  - match: "docs/**/*.md"
    category: docs
    impact_group: docs
    risk: docs_only
    commands:
      - docs_strict

  - match: "README.md"
    category: docs
    impact_group: docs
    risk: docs_only
    commands:
      - docs_strict

  - match: "AGENTS.md"
    category: agent_context
    impact_group: workflow_context
    risk: wide
    requires_full_verification: true
    commands:
      - docs_strict
      - verify_fast

  - match: "CLAUDE.md"
    category: agent_context
    impact_group: workflow_context
    risk: wide
    requires_full_verification: true
    commands:
      - docs_strict
      - verify_fast

  - match: "governance/work-items.json"
    category: governance_projection
    impact_group: governance
    risk: bounded
    commands:
      - governance_check
      - task_scope_check

  - match: "governance/task-scopes/*.snapshot.json"
    category: task_scope_projection
    impact_group: governance
    risk: bounded
    commands:
      - task_scope_check

  - match: "governance/README.md"
    category: governance_docs
    impact_group: governance
    risk: bounded
    commands:
      - workflow_contract_check
      - docs_strict

  - match: "policy/engineering-lane.json"
    category: engineering_policy
    impact_group: engineering_policy
    risk: bounded
    commands:
      - workflow_contract_check

  - match: "packages/dspx-core/src/dspx/cli/commands/program_promote.py"
    category: activation_packet_cli
    impact_group: activation_evidence
    risk: expanded
    exclusive: true
    commands:
      - ruff_touched
      - typecheck_core
      - pytest_program_activation_packet

  - match: "packages/dspx-core/src/dspx/cli/commands/program_refine.py"
    category: program_refinement_cli
    impact_group: program_refinement_candidates
    risk: expanded
    exclusive: true
    commands:
      - ruff_touched
      - typecheck_core
      - pytest_program_oracle_refinement
      - pytest_refinement_candidate_comparison
      - pytest_program_sidecar_boundaries

  - match: "packages/dspx-core/src/dspx/services/program_activation_packet.py"
    category: activation_packet
    impact_group: activation_evidence
    risk: expanded
    exclusive: true
    commands:
      - ruff_touched
      - typecheck_core
      - pytest_program_activation_packet

  - match: "packages/dspx-core/src/dspx/cli/*.py"
    category: cli_boundary
    impact_group: boundary_hardening
    risk: expanded
    commands:
      - ruff_touched
      - typecheck_all
      - pytest_boundary_adversarial
      - pytest_cli_dspx
      - pytest_forge_cli_policy
      - pytest_program_runtime_episode
