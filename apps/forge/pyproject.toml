[project]
name = "dspx-forge"
version = "0.3.0"
license = "LicenseRef-Apache-2.0-with-AI-Rider"
license-files = ["LICENSE"]
description = "Optional Forge workflow application built on DSPx Core"
readme = { text = "DSPx Forge is the optional backlog and issue-workflow application for DSPx. Requires Python 3.13 or 3.14. Install with `pip install dspx-forge`; run `dspx-forge --help`. Depends on DSPx Core >=0.3.0,<0.4.0. Alpha software. Custom Apache-based license with restrictive AI rider, not unmodified Apache-2.0. [License](https://github.com/tryingET/dspx/blob/dspx-forge-v0.3.0/LICENSE). [Installation and release notes](https://github.com/tryingET/dspx/blob/dspx-forge-v0.3.0/docs/project/package-release.md).", content-type = "text/markdown" }
requires-python = ">=3.13,<3.15"
keywords = ["dspy", "workflow", "forge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "dspx-core>=0.3.0,<0.4.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.1",
  "httpx>=0.28.1",
  "typer>=0.12.5",
]

[tool.uv.sources]
dspx-core = { workspace = true }

[project.scripts]
dspx-forge = "dspx_forge.cli:main"

[tool.uv.build-backend]
module-name = "dspx_forge"

[build-system]
requires = ["uv-build>=0.2,<0.12"]
build-backend = "uv_build"
