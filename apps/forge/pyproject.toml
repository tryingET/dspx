[project]
name = "dspx-forge"
version = "0.1.0"
description = "Forge app for DSPx monorepo"
requires-python = ">=3.13"
dependencies = [
  "dspx-core",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.1",
  "httpx>=0.28.1",
  "typer>=0.12.5",
]

[tool.uv.sources]
dspx-core = { workspace = true }

[project.scripts]
dspx-forge = "dspx_forge.cli:main"

[tool.uv.build-backend]
module-name = "dspx_forge"

[build-system]
requires = ["uv-build>=0.2"]
build-backend = "uv_build"
