[project]
name = "dspx-forge"
version = "0.2.1"
description = "Optional Forge workflow application built on DSPx Core"
readme = { text = "DSPx Forge is the optional backlog and issue-workflow application for the DSPx monorepo. It provides the `dspx-forge` command-line interface and depends only on the public DSPx Core package.", content-type = "text/markdown" }
requires-python = ">=3.13,<3.15"
keywords = ["dspy", "workflow", "forge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "dspx-core>=0.2.1,<0.3.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.1",
  "httpx>=0.28.1",
  "typer>=0.12.5",
]

[tool.uv.sources]
dspx-core = { workspace = true }

[project.scripts]
dspx-forge = "dspx_forge.cli:main"

[tool.uv.build-backend]
module-name = "dspx_forge"

[build-system]
requires = ["uv-build>=0.2,<0.12"]
build-backend = "uv_build"
