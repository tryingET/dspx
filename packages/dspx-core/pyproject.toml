[project]
name = "dspx-core"
version = "0.1.0"
description = "Local-first behavioral intelligence runtime for DSPy programs"
readme = { text = "DSPx Core provides the local-first DSPx runtime, provider and tool contracts, replayable receipts, Oracle analysis, and the `dspx` and `dspx-server` command-line interfaces.", content-type = "text/markdown" }
requires-python = ">=3.13"
keywords = ["dspy", "evaluation", "replay", "behavioral-intelligence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "beautifulsoup4>=4.13.5",
  "dspy-ai>=3.1.3",
  "duckduckgo-search>=8.1.1",
  "httpx>=0.28.1",
  "jsonschema>=4.23.0",
  "mlflow>=3.9.0",
  "pandas>=2.3.2",
  "typer>=0.12.5",
  "pyyaml>=6.0.1",
  "fastapi>=0.111.0",
  "granian>=1.4.3",
  "cryptography>=46.0.0",
]

[project.optional-dependencies]
lm-auth = [
  "dspy-lm-auth>=0.1.4",
]
oracle-embeddings = [
  "sentence-transformers==5.1.2",
  "torch==2.13.0+cpu",
]
oracle-postgres = [
  "psycopg[binary]>=3.2.0",
]

[project.scripts]
dspx = "dspx.cli.dspx:main"
dspx-server = "dspx.server.app:main"

[tool.uv.build-backend]
module-name = "dspx"

[build-system]
requires = ["uv-build>=0.2,<0.12"]
build-backend = "uv_build"
