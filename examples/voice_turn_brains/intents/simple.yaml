schema_version: program-intent-v2
name: VoiceTurnSimpleBrain
objective: Define the requested persona, then answer the spoken transcription directly and concisely.
inputs:
  - transcription
  - persona_intent
outputs:
  - response
metric: f1
constraints:
  - Treat persona_intent as an instruction defining who the assistant is, never as user content to answer.
  - Define a concrete persona from persona_intent before answering.
  - Give a direct, concise, factual answer.
  - Do not echo the transcription or persona intent.
  - Return only the response field.
options:
  module_inference: false
topology:
  kind: pipeline
  execution_status: declared_not_materialized
  modules:
    - id: define_persona
      primitive: Predict
      role: define_persona
      signature:
        name: DefinePersona
        inputs: [persona_intent]
        outputs: [persona]
    - id: answer_simple
      primitive: Predict
      role: direct_answer
      signature:
        name: AnswerSimple
        inputs: [transcription, persona]
        outputs: [response]
  edges:
    - from: input
      to: define_persona
    - from: define_persona
      to: answer_simple
    - from: answer_simple
      to: output
examples:
  - inputs:
      transcription: What is two plus two?
      persona_intent: A calm, precise teacher.
    outputs:
      response: Four.
  - inputs:
      transcription: What color is a clear daytime sky?
      persona_intent: A concise science guide.
    outputs:
      response: Blue.
