schema_version: program-intent-v2
name: VoiceTurnResearchedBrain
objective: Define the requested persona, retrieve bounded local evidence, and answer with corpus-grounded citations.
inputs:
  - transcription
  - persona_intent
outputs:
  - response
metric: f1
constraints:
  - Treat persona_intent as an instruction defining who the assistant is, never as user content to answer.
  - Define a concrete persona from persona_intent before answering.
  - Use only facts supported by passages whose lexical score is greater than zero.
  - Cite every material claim with the exact retrieved document id in square brackets.
  - Never invent a citation id, source, quote, or external fact.
  - 'If no retrieved passage with positive score supports the question, respond exactly: No supporting sources were found in the declared corpus.'
  - Return only the response field.
options:
  module_inference: false
topology:
  kind: retrieve_then_answer
  execution_status: declared_not_materialized
  modules:
    - id: define_persona
      primitive: Predict
      role: define_persona
      signature:
        name: DefinePersona
        inputs: [persona_intent]
        outputs: [persona]
    - id: retrieve_corpus
      primitive: Retriever
      role: retrieve_grounding
      signature:
        name: RetrieveVoiceTurnCorpus
        inputs: [transcription]
        outputs: [passages]
      retriever:
        mode: local_corpus_snapshot
        path: corpus/voice_turn_corpus.jsonl
        id_field: id
        text_field: text
        k: 3
    - id: answer_researched
      primitive: ChainOfThought
      role: cited_corpus_answer
      signature:
        name: AnswerResearched
        inputs: [transcription, persona, passages]
        outputs: [response]
  edges:
    - from: input
      to: define_persona
    - from: input
      to: retrieve_corpus
    - from: define_persona
      to: answer_researched
    - from: retrieve_corpus
      to: answer_researched
    - from: answer_researched
      to: output
examples:
  - inputs:
      transcription: Who owns capture, turn composition, and the six brains?
      persona_intent: A precise systems researcher.
    outputs:
      response: Workstation owns capture, local-ai-control-plane owns turn composition and its receipt, and DSPx owns the six separate brains and GEPA evidence [voice-turn-owner-split].
  - inputs:
      transcription: Is this voice turn streaming, and is Pipecat part of v1?
      persona_intent: A concise technical analyst.
    outputs:
      response: V1 is a batch, one-time turn; streaming, a continuing loop, and Pipecat are deferred to a later real-time phase [voice-turn-batch-scope].
