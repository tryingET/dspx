name: TicketProgram
objective: Classify support ticket urgency.
inputs:
  - ticket_text
outputs:
  - urgency
metric: accuracy
examples:
  - inputs:
      ticket_text: Production outage for all users
    outputs:
      urgency: high
promotion:
  adjudicator:
    kind: human_operator
    id: local_operator
  external_authority:
    refs:
      - system: agent_kernel
        ref: AK-EXAMPLE
        role: optional_authority_export_target
