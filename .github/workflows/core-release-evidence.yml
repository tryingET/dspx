name: Core release evidence

on:
  workflow_dispatch:
    inputs:
      retention_class:
        description: Public evidence custody class
        required: true
        default: trusted_run_14d
        type: choice
        options:
          - trusted_run_14d
          - release_candidate_90d

# This workflow authenticates and discloses evidence. It cannot publish a package
# or authorize a release. Evidence activation validates the exact disabled roster
# shape but does not fabricate or require release-owner bindings.
permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: core-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"
  COSIGN_VERSION: v2.6.4
  POLICY_PATH: governance/release-signing/trust-policy-v001.json
  SELECTOR_PATH: governance/release-signing/policy-selector-v001.json
  ROSTER_PATH: governance/release-signing/release-owner-roster-v001.json

jobs:
  evidence-custody:
    name: Evidence-only public custody
    if: ${{ vars.DSPX_CORE_RELEASE_SIGNING_ENABLED == 'true' }}
    environment: core-release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Selector v1 binds an immutable historical policy commit.
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.1.5
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: false

      - name: Install pinned cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Fetch and pin the accepted Sigstore trust root
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-release"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/sigstore/root-signing/5a1d1a50849a7805f290c90c3bf5ee3ada8da3af/targets/trusted_root.json \
            --output "$RUNNER_TEMP/core-release/trusted_root.json"
          echo '6494e21ea73fa7ee769f85f57d5a3e6a08725eae1e38c755fc3517c9e6bc0b66  '"$RUNNER_TEMP/core-release/trusted_root.json" \
            | sha256sum --check --strict

      - name: Install frozen verification environment
        run: uv sync --frozen --all-packages --dev

      - name: Fail closed on workload or provider prerequisite drift
        env:
          EXPECTED_REPOSITORY: tryingET/dspx
          EXPECTED_REPOSITORY_ID: "1318473695"
          EXPECTED_OWNER_ID: "260287438"
          EXPECTED_WORKFLOW_REF: tryingET/dspx/.github/workflows/core-release-evidence.yml@refs/heads/main
          PROVIDER_RETENTION_CAP_DAYS: ${{ vars.DSPX_CORE_RELEASE_RETENTION_CAP_DAYS }}
          REVIEW_90D_CONFIGURED: ${{ vars.DSPX_CORE_RELEASE_90D_REVIEW_CONFIGURED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
          test "$GITHUB_REPOSITORY_OWNER_ID" = "$EXPECTED_OWNER_ID"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "${{ github.repository_visibility }}" = public
          test "${{ github.ref_protected }}" = true
          # The Actions token cannot read repository-administration endpoints.
          # These non-secret assertions are written only after an authenticated
          # controller observes the exact environment and provider retention cap.
          [[ "$PROVIDER_RETENTION_CAP_DAYS" =~ ^[0-9]+$ ]]
          requested_days=14
          if test "${{ inputs.retention_class }}" = release_candidate_90d; then
            requested_days=90
            test "$REVIEW_90D_CONFIGURED" = true
          fi
          provider_cap="$PROVIDER_RETENTION_CAP_DAYS"
          test "$provider_cap" -ge "$requested_days"
          # Evidence authenticity is separate from unavailable release authority.
          # Validate the exact disabled roster without inventing owner bindings.
          uv run --frozen --no-sync python scripts/ci/core_release_signing.py preflight-policy \
            --policy "$POLICY_PATH" \
            --selector "$SELECTOR_PATH" \
            --roster "$ROSTER_PATH"
          printf 'requested_days=%s\nprovider_cap=%s\n' "$requested_days" "$provider_cap" \
            >> "$GITHUB_ENV"

      - name: Build exact local evidence bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-release"
          bash scripts/ci/package-check.sh \
            --retain-core-evidence "$RUNNER_TEMP/core-release/evidence.zip"
          uv run --frozen --no-sync python scripts/ci/core_release_custody.py preflight-bundle \
            --bundle "$RUNNER_TEMP/core-release/evidence.zip" \
            > "$RUNNER_TEMP/core-release/public-preflight.json"

      - name: Build canonical wheel-only statement
        run: |
          set -euo pipefail
          uv run --frozen --no-sync python scripts/ci/core_release_signing.py build-statement \
            --bundle "$RUNNER_TEMP/core-release/evidence.zip" \
            --policy "$POLICY_PATH" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-commit "$GITHUB_WORKFLOW_SHA" \
            --out "$RUNNER_TEMP/core-release/signed-statement.json"
          uv run --frozen --no-sync python scripts/ci/core_release_signing.py extract-wheel \
            --bundle "$RUNNER_TEMP/core-release/evidence.zip" \
            --out "$RUNNER_TEMP/core-release/subject.whl"

      - name: Keyless-sign and verify the evidence statement
        run: |
          set -euo pipefail
          cosign attest-blob --yes \
            --new-bundle-format \
            --trusted-root "$RUNNER_TEMP/core-release/trusted_root.json" \
            --statement "$RUNNER_TEMP/core-release/signed-statement.json" \
            --bundle "$RUNNER_TEMP/core-release/statement.sigstore.json" \
            "$RUNNER_TEMP/core-release/subject.whl"
          uv run --frozen --no-sync python scripts/ci/core_release_signing.py verify-bundle \
            --statement "$RUNNER_TEMP/core-release/signed-statement.json" \
            --sigstore-bundle "$RUNNER_TEMP/core-release/statement.sigstore.json" \
            --subject "$RUNNER_TEMP/core-release/subject.whl" \
            --evidence-bundle "$RUNNER_TEMP/core-release/evidence.zip" \
            --policy "$POLICY_PATH" \
            --selector "$SELECTOR_PATH" \
            --trusted-root "$RUNNER_TEMP/core-release/trusted_root.json" \
            --creation-policy-only
          uv run --frozen --no-sync python scripts/ci/core_release_custody.py preflight-upload \
            --file "$RUNNER_TEMP/core-release/evidence.zip" \
            --file "$RUNNER_TEMP/core-release/signed-statement.json" \
            --file "$RUNNER_TEMP/core-release/statement.sigstore.json" \
            > "$RUNNER_TEMP/core-release/public-upload-preflight.json"

      - name: Upload public evidence bundle
        id: evidence_upload
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dspx-core-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/core-release/evidence.zip
            ${{ runner.temp }}/core-release/signed-statement.json
            ${{ runner.temp }}/core-release/statement.sigstore.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_class == 'release_candidate_90d' && 90 || 14 }}
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Observe evidence upload before any retry or success claim
        id: evidence_observation
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
          ARTIFACT_NAME: dspx-core-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          api="$RUNNER_TEMP/core-release/evidence-api.json"
          observation="$RUNNER_TEMP/core-release/evidence-observation.json"
          if ! gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --slurp > "$api"; then
            jq -n --argjson run_id "$GITHUB_RUN_ID" \
              '{schema_version:"dspx-github-artifact-observation-v1",query_status:"error",run_id:$run_id,complete:false,artifacts:[]}' \
              > "$observation"
          else
            jq --argjson run_id "$GITHUB_RUN_ID" \
              '{schema_version:"dspx-github-artifact-observation-v1",query_status:"success",run_id:$run_id,complete:true,artifacts:[.[].artifacts[]]}' \
              "$api" > "$observation"
          fi
          outcome=failure
          if test "$UPLOAD_OUTCOME" = success; then outcome=success; fi
          uv run --frozen --no-sync python scripts/ci/core_release_custody.py observe-upload \
            --observation "$observation" \
            --operation-outcome "$outcome" \
            --name "$ARTIFACT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/core-release/evidence-effect.json"
          artifact_id="$(jq -er '.artifact.id' "$RUNNER_TEMP/core-release/evidence-effect.json")"
          printf 'artifact_id=%s\n' "$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Build and sign custody receipt
        env:
          ARTIFACT_ID: ${{ steps.evidence_observation.outputs.artifact_id }}
          ARTIFACT_NAME: dspx-core-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifact="$(jq -er --argjson id "$ARTIFACT_ID" '.[] | .artifacts[] | select(.id == $id)' "$RUNNER_TEMP/core-release/evidence-api.json")"
          observed_at="$(jq -er '.created_at' <<<"$artifact")"
          expires_at="$(jq -er '.expires_at' <<<"$artifact")"
          artifact_digest="$(jq -er '.digest' <<<"$artifact")"
          artifact_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$ARTIFACT_ID"
          workflow_file_sha256="$(sha256sum .github/workflows/core-release-evidence.yml | cut -d' ' -f1)"
          bundle_sha256="$(sha256sum "$RUNNER_TEMP/core-release/evidence.zip" | cut -d' ' -f1)"
          manifest_sha256="$(jq -er '.manifest_sha256' "$RUNNER_TEMP/core-release/public-preflight.json")"
          statement_sha256="$(sha256sum "$RUNNER_TEMP/core-release/signed-statement.json" | cut -d' ' -f1)"
          sigstore_sha256="$(sha256sum "$RUNNER_TEMP/core-release/statement.sigstore.json" | cut -d' ' -f1)"
          policy_selector="$(uv run --frozen --no-sync python scripts/ci/core_release_signing.py selector-ref --selector "$SELECTOR_PATH")"
          jq -n \
            --argjson artifact_id "$ARTIFACT_ID" --arg artifact_url "$artifact_url" \
            --arg artifact_digest "$artifact_digest" --arg artifact_name "$ARTIFACT_NAME" \
            --arg evidence_bundle_sha256 "$bundle_sha256" --arg bundle_manifest_sha256 "$manifest_sha256" \
            --arg signed_statement_sha256 "$statement_sha256" --arg sigstore_bundle_sha256 "$sigstore_sha256" \
            --arg workflow_file_sha256 "$workflow_file_sha256" --arg source_commit_sha "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson policy_version 1 --arg policy_selector "$policy_selector" \
            --arg retention_class "${{ inputs.retention_class }}" --argjson provider_retention_cap_days "$provider_cap" \
            --arg observed_at "$observed_at" --arg expires_at "$expires_at" \
            '$ARGS.named' > "$RUNNER_TEMP/core-release/receipt-metadata.json"
          uv run --frozen --no-sync python scripts/ci/core_release_custody.py build-receipt \
            --metadata "$RUNNER_TEMP/core-release/receipt-metadata.json" \
            --out "$RUNNER_TEMP/core-release/custody-receipt.json"
          uv run --frozen --no-sync python scripts/ci/core_release_signing.py build-receipt-statement \
            --receipt "$RUNNER_TEMP/core-release/custody-receipt.json" \
            --out "$RUNNER_TEMP/core-release/custody-receipt-statement.json"
          cosign attest-blob --yes \
            --new-bundle-format \
            --trusted-root "$RUNNER_TEMP/core-release/trusted_root.json" \
            --statement "$RUNNER_TEMP/core-release/custody-receipt-statement.json" \
            --bundle "$RUNNER_TEMP/core-release/custody-receipt.sigstore.json" \
            "$RUNNER_TEMP/core-release/custody-receipt.json"
          uv run --frozen --no-sync python scripts/ci/core_release_signing_identity.py \
            --statement "$RUNNER_TEMP/core-release/custody-receipt-statement.json" \
            --sigstore-bundle "$RUNNER_TEMP/core-release/custody-receipt.sigstore.json" \
            --subject "$RUNNER_TEMP/core-release/custody-receipt.json" \
            --policy "$POLICY_PATH" \
            --trusted-root "$RUNNER_TEMP/core-release/trusted_root.json"

      - name: Upload signed custody receipt
        id: receipt_upload
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dspx-core-custody-receipt-${{ steps.evidence_observation.outputs.artifact_id }}
          path: |
            ${{ runner.temp }}/core-release/custody-receipt.json
            ${{ runner.temp }}/core-release/custody-receipt-statement.json
            ${{ runner.temp }}/core-release/custody-receipt.sigstore.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_class == 'release_candidate_90d' && 90 || 14 }}
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Observe receipt upload and fail closed on ambiguity
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_OUTCOME: ${{ steps.receipt_upload.outcome }}
          ARTIFACT_NAME: dspx-core-custody-receipt-${{ steps.evidence_observation.outputs.artifact_id }}
          RECEIPT_ARTIFACT_ID: ${{ steps.receipt_upload.outputs.artifact-id }}
          RECEIPT_PROVIDER_DIGEST: ${{ steps.receipt_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          api="$RUNNER_TEMP/core-release/receipt-api.json"
          observation="$RUNNER_TEMP/core-release/receipt-observation.json"
          if ! gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --slurp > "$api"; then
            jq -n --argjson run_id "$GITHUB_RUN_ID" \
              '{schema_version:"dspx-github-artifact-observation-v1",query_status:"error",run_id:$run_id,complete:false,artifacts:[]}' \
              > "$observation"
          else
            jq --argjson run_id "$GITHUB_RUN_ID" \
              '{schema_version:"dspx-github-artifact-observation-v1",query_status:"success",run_id:$run_id,complete:true,artifacts:[.[].artifacts[]]}' \
              "$api" > "$observation"
          fi
          outcome=failure
          if test "$UPLOAD_OUTCOME" = success; then outcome=success; fi
          effect="$RUNNER_TEMP/core-release/receipt-effect.json"
          uv run --frozen --no-sync python scripts/ci/core_release_custody.py observe-upload \
            --observation "$observation" \
            --operation-outcome "$outcome" \
            --name "$ARTIFACT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            > "$effect"
          test -n "$RECEIPT_ARTIFACT_ID"
          test -n "$RECEIPT_PROVIDER_DIGEST"
          uv run --frozen --no-sync python scripts/ci/core_release_custody.py verify-availability \
            --receipt "$RUNNER_TEMP/core-release/custody-receipt.json" \
            --receipt-artifact-id "$RECEIPT_ARTIFACT_ID" \
            --receipt-provider-digest "$RECEIPT_PROVIDER_DIGEST" \
            --observation "$observation" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' 'Evidence and receipt custody are current. Package release authority remains false.'
