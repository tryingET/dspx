name: Release core package

on:
  push:
    tags:
      - 'dspx-core-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI (requires PYPI_TOKEN secret)'
        required: false
        default: 'false'

jobs:
  release-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Sync dependencies
        run: uv sync

      - name: Validate tag matches core version
        if: startsWith(github.ref, 'refs/tags/dspx-core-v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#dspx-core-v}"
          PKG_VERSION="$(python - <<'PY'
import tomllib
from pathlib import Path

text = Path('packages/dspx-core/pyproject.toml').read_text(encoding='utf-8')
print(tomllib.loads(text)['project']['version'])
PY
          )"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag version ($TAG_VERSION) != package version ($PKG_VERSION)"
            exit 1
          fi

      - name: Quality gates (core)
        run: |
          just monorepo-check
          just lint-core
          just typecheck-core
          just test-core

      - name: Build core package
        run: uv build --package dspx-core --out-dir dist/core --clear

      - name: Wheel smoke (core entrypoint)
        run: |
          set -euo pipefail
          uv venv .venv-release-core
          uv pip install --python .venv-release-core/bin/python dist/core/dspx_core-*.whl
          .venv-release-core/bin/dspx --help

      - name: Publish core to PyPI
        if: startsWith(github.ref, 'refs/tags/dspx-core-v') || github.event.inputs.publish == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
            echo "PYPI_TOKEN secret missing"
            exit 1
          fi
          uv publish --token "$UV_PUBLISH_TOKEN" dist/core/dspx_core-*
