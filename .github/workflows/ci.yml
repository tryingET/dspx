name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv sync --frozen --all-packages --dev
      - run: just ci-quality

  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [core-0, core-1, core-2, core-3, forge, slow]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Prepare owner-only temporary directory
        run: |
          install -d -m 700 "$RUNNER_TEMP/dspx-tmp"
          echo "TMPDIR=$RUNNER_TEMP/dspx-tmp" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # Official Node.js 24 migration commit; no Node.js 24 release tag exists yet.
      - uses: cue-lang/setup-cue@dbedece1c566369854bef676ae83075f3b3c9f88
      - run: uv sync --frozen --all-packages --dev
      - name: Run bounded offline shard with coverage
        env:
          CI_COVERAGE: "1"
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
        run: just ci-test-shard shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Coverage ratchet
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-packages --dev
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - run: uv run --frozen --no-sync coverage combine coverage-data
      - run: uv run --frozen --no-sync coverage report

  package:
    name: Build and package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.14"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv sync --frozen --all-packages --dev
      - run: just ci-package
