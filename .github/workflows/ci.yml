name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Sync dependencies
        run: uv sync

      - name: Pre-commit (local hooks)
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Format check (ruff)
        run: uvx ruff format --check src docs

      - name: Lint (ruff)
        run: just lint

      - name: Typecheck (mypy)
        run: just typecheck

      - name: Tests (pytest)
        run: just test
