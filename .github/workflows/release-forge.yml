name: Release forge package

on:
  push:
    tags:
      - 'dspx-forge-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI (requires PYPI_TOKEN secret)'
        required: false
        default: 'false'

jobs:
  release-forge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Sync dependencies
        run: uv sync

      - name: Validate tag matches forge version
        if: startsWith(github.ref, 'refs/tags/dspx-forge-v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#dspx-forge-v}"
          PKG_VERSION="$(python - <<'PY'
import tomllib
from pathlib import Path

text = Path('apps/forge/pyproject.toml').read_text(encoding='utf-8')
print(tomllib.loads(text)['project']['version'])
PY
          )"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag version ($TAG_VERSION) != package version ($PKG_VERSION)"
            exit 1
          fi

      - name: Quality gates (forge)
        run: |
          just monorepo-check
          just lint-forge
          just typecheck-forge
          just test-forge

      - name: Build forge package
        run: uv build --package dspx-forge --out-dir dist/forge --clear

      - name: Build core package for smoke dependency
        run: uv build --package dspx-core --out-dir dist/core-smoke --clear

      - name: Wheel smoke (forge entrypoint)
        run: |
          set -euo pipefail
          uv venv .venv-release-forge
          uv pip install --python .venv-release-forge/bin/python \
            dist/core-smoke/dspx_core-*.whl \
            dist/forge/dspx_forge-*.whl
          .venv-release-forge/bin/dspx-forge --help

      - name: Publish forge to PyPI
        if: startsWith(github.ref, 'refs/tags/dspx-forge-v') || github.event.inputs.publish == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
            echo "PYPI_TOKEN secret missing"
            exit 1
          fi
          uv publish --token "$UV_PUBLISH_TOKEN" dist/forge/dspx_forge-*
