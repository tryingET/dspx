# dspx in System4D terms.
# A softwareco owned Python uv monorepo: DSPx, a local-first behavioral runtime for DSPy (packages/dspx-core) plus the optional Forge app (apps/forge).
# Written for the agents that work in and beside this repo: read it before
# changing what the repo does or how. README.md, AGENTS.md and docs/project/
# hold the long form; keep this file true to the shipped code.
ontology:
  system4d:
    name: "DSPx"
    version: "0.1"
    container:
      boundary:
        in_scope:
          - "Structured intent to runnable DSPy candidate assemblies: program-gen, program-loop, signature gen and module-gen"
          - "Provider-aware local execution and generated behavior evaluation (stub, pi-rpc, litellm/DSPy typed-LM providers)"
          - "Run receipts, manifests and replay checks with a machine-readable claim matrix"
          - "Oracle: candidate-local indexing, search, drift, territory, frontiers, attractors and contracts over observed behavior"
          - "Local refinement and review sidecars: proposals, GEPA attempts, comparisons, jury and adjudication records, candidate-state summaries"
          - "dspx-server (FastAPI) for signature, module and Mermaid generation, and the Forge backlog and issue-workflow app"
        out_of_scope:
          - "Task, direction, decision and evidence state: Agent Kernel (ak) owns it; docs and governance/task-scopes/ snapshots are projections"
          - "Shared vocabulary: concepts come from the core and company ontology layers in ontology/manifest.yaml; the repo defines its own only where those have none"
          - "Prompt and procedure truth: Prompt Vault owns it; DSPx does not read machine-local prompt files as canonical"
          - "Production activation of generated programs: the owning domain judges under holdingco/governance-kernel generated-dspy-program-promotion-governance"
          - "Natural-language interpretation of intent: the repo-owned Pi skill turns requests into intents (docs/project/pi-dspx-intent-assistant.md); Core consumes structured intent"
          - "Domain truth for generated review programs (dependency semantics, remediation, acceptance): the supplying owner keeps it"
          - "DSPy and MLflow core changes: they go upstream as PRs"
      constraints:
        - "Primary language: Python >=3.13,<3.15 with uv and just; quality checks are ruff, ty and pytest"
        - "dspy and dspy-ai pinned to 3.3.1 and litellm to 1.82.1; uv resolution is frozen by exclude-newer 2026-08-21"
        - "packages/dspx-core never imports apps/* (dspx_forge); Forge depends on dspx-core >=0.3.0,<0.4.0"
        - "Generation, replay, local eval, Oracle evidence and jury sidecars stay local until an owner-authorized export surface exists (AGENTS.md, locality axiom)"
        - "The CLI defaults to read-only HTTP and tool behaviour; mutating calls need explicit invocation-scoped allowance"
        - "MLflow is an optional observability sink (MLFLOW_ENABLE=0 disables it); receipts and manifests stay canonical for replay"
      edges:
        - name: "Stage A/B/C/D visual program intents and candidate directories"
          direction: "bi"
          protocol: "file"
          system: "softwareco/owned/designmd-foundry"
          contract: "docs/adr/20260510-target-protocol-fidelity-gates.md; designmd-foundry ADR-0006"
        - name: "Pi as a provider"
          direction: "out"
          protocol: "cli"
          system: "Pi runtime in persistent RPC mode (DSPX_PROVIDER=pi-rpc)"
          contract: "docs/adr/20260206-pi-rpc-provider.md"
        - name: "LLM providers"
          direction: "out"
          protocol: "http"
          system: "litellm and dspy-lm-auth routes behind DSPx-owned provider ports"
          contract: "docs/adr/20260809-dspy-3-3-typed-lm-hard-cutover.md, docs/project/provider-runtime-v4.md"
        - name: "Run tracking"
          direction: "out"
          protocol: "http"
          system: "MLflow (optional)"
          contract: "docs/ARCHITECTURE.md (MLFLOW_ENABLE=0 behaviour table)"
        - name: "Shared Oracle coordinate store"
          direction: "out"
          protocol: "postgres"
          system: "Postgres/pgvector (oracle-postgres extra); runtime readiness unproved"
          contract: "docs/adr/20260505-shared-oracle-coordinate-backend.md, docs/adr/20260506-oracle-evidence-publication-boundary.md"
        - name: "Package release"
          direction: "out"
          protocol: "http"
          system: "GitHub Actions and PyPI (protected pypi-core and pypi-forge environments)"
          contract: "docs/adr/20260919-package-publication.md, docs/project/package-release.md"
      dependencies:
        - name: "Agent Kernel (ak)"
          type: "runtime"
          note: "Tasks, direction, decisions and evidence for this repo live in AK, not in markdown; ak direction check reconciles the docs projection"
        - name: "core/ontology-kernel and softwareco/ontology"
          type: "build"
          note: "The core and company ontology layers, pinned in ontology/manifest.yaml"
        - name: "core/rocs-cli"
          type: "build"
          note: "Runs the ontology checks through ./scripts/rocs.sh, which pins the release it accepts"
        - name: "engineering-core"
          type: "build"
          note: "The py engineering lane at v0.12.2: policy/engineering-lane.json points at it, docs/engineering.local.md holds the local overrides"
        - name: "DSPy 3.3.1 and GEPA 0.1.4"
          type: "runtime"
          note: "The program substrate and the bounded optimizer path; one DSPyTypedLMAdapter is the only dspy.BaseLM subclass"
        - name: "sentence-transformers and CPU torch (oracle-embeddings extra)"
          type: "runtime"
          note: "Model-backed Oracle embeddings; mDenseOn version 2 is the dense default, mock embeddings are plumbing-only"
      anti_goals:
        - "Further autonomous-foundry expansion before Core production readiness (docs/project/product-posture.md, Active frontier)"
        - "Ranking, promoting or activating candidates from Oracle or local evidence by implication"
        - "Calling local evidence production ready, approved, signed, published, activated or authoritative without the owning contract's proof (product-posture.md, Status language rules)"
        - "Success-shaped output from failed transport, auth or process results"
    compass:
      drivers:
        - "Local DSPy development should be safer, reproducible and inspectable: generation, optimization, replay and behavioral analysis as an engineering discipline rather than a prompt-only craft (docs/project/purpose.md)"
        - "Receipts prove what ran, but only executable evaluation shows whether a generated program works (docs/system4d/compass.md)"
      outcomes:
        - "A user states one intent and receives a runnable, evaluated, replayable DSPy candidate assembly whose behavior can be inspected, compared, improved and governed (docs/project/vision.md)"
      tradeoffs:
        - decision: "How DSPx meets DSPy 3.3"
          chosen: "A hard breaking cutover: transport providers implement DSPx-owned ports; one typed-LM adapter subclasses dspy.BaseLM"
          because: "The nine provider classes conflated transport, DSPx DTOs and DSPy lifecycle; Core needs exact provider support, not compatibility breadth (docs/adr/20260809-dspy-3-3-typed-lm-hard-cutover.md, Decision 118)"
        - decision: "How Pi joins as a provider"
          chosen: "A persistent RPC subprocess (pi --mode rpc) behind the common provider registry"
          because: "Keeps providers interchangeable and avoids repeated startup cost (docs/adr/20260206-pi-rpc-provider.md)"
        - decision: "How packages are published"
          chosen: "An exact-artifact publisher behind protected single-owner GitHub environments, Core before Forge"
          because: "Owner approval binds the displayed manifest and hashes; OIDC identity is not that approval (docs/adr/20260919-package-publication.md, AK Decision 162)"
        - decision: "What an Oracle backend is"
          chosen: "Three separate layers: semantic-analysis LM, embedding model and coordinate store, each with its own acceptance"
          because: "Store durability cannot prove semantic quality, nor LM analysis retrieval quality (product-posture.md, Root cause)"
    engine:
      triggers:
        - "An operator or agent runs dspx program-gen, program-loop, program-refine, run replay or oracle commands (just dspx ...)"
        - "A request reaches dspx-server, or Forge runs a backlog workflow"
        - "An operator runs Foundry-generated Stage templates through DSPx"
        - "A push to main runs .github/workflows/ci.yml; a release runs release.yml"
      states:
        - name: "materialized"
          meaning: "program-gen wrote a candidate assembly with manifest and receipt; behavior is reported separately and failed behavior exits non-zero"
        - name: "receipt-checked"
          meaning: "run replay --check-only proved receipt integrity only; runtime, semantic and quality reproduction stay not run"
        - name: "Oracle-indexed"
          meaning: "Candidate evidence sits in a candidate-local CoordinateIndex, not a shared Oracle publication"
        - name: "not_promoted"
          meaning: "The promotion state of every local candidate; sidecars and activation packets never change it"
      invariants:
        - id: "DSPX-INV-001"
          statement: "Core never imports dspx_forge"
          enforcement: "test: scripts/check_monorepo_boundaries.py (just monorepo-check), tests/test_monorepo_boundaries.py"
        - id: "DSPX-INV-002"
          statement: "A replay check proves only its declared claim matrix and rejects authority or semantic widening"
          enforcement: "test: tests/test_replay_claims.py, tests/test_run_receipts_replay.py"
        - id: "DSPX-INV-003"
          statement: "program-gen refuses a non-empty candidate output directory rather than overwrite existing evidence"
          enforcement: "test: tests/test_program_service_core.py (test_program_service_refuses_non_empty_outdir)"
        - id: "DSPX-INV-004"
          statement: "Mutating OpenAPI calls need confirmation or explicit approval"
          enforcement: "test: tests/test_openapi_confirm_cli.py"
        - id: "DSPX-INV-005"
          statement: "Artifact cleanup previews first, applies only with the unchanged plan id and exact root confirmation, rejects dangerous roots and never follows symlinks"
          enforcement: "test: scripts/cleanup_artifacts.py, tests/test_cleanup_artifacts.py"
      lifecycle:
        - "Normalize the intent and expose its assumptions"
        - "Materialize explicit candidate surfaces"
        - "Execute and evaluate under declared runtime, provider, data and metric conditions"
        - "Emit and verify receipts, traces and evaluation evidence"
        - "Let Oracle interpret observed behavior without granting it authority"
        - "Refine or compare through explicit bounded attempts"
        - "Leave review, signing, release, promotion and activation to separate owner-governed transitions"
    fog:
      assumptions:
        - id: "DSPX-A-001"
          statement: "Receipts are deterministic: the same input gives the same receipt hash (docs/system4d/fog.md)"
          how_to_validate: "Regenerate one intent twice with DSPX_PROVIDER=stub and compare receipt hashes; just dspx run replay --from the candidate manifest.json.meta.json --check-only --json checks one receipt"
      risks:
        - id: "DSPX-R-001"
          statement: "Live-provider and semantic quality are unproved beyond three one-example lexical strata and 15 frozen embedding labels; the v10 semantic-analysis attempt is terminal effect_indeterminate"
          mitigation: "Keep proofs adjacent to their nonclaims (product-posture.md, Explicit nonclaims); one-shot ledgers forbid selective reruns"
        - id: "DSPX-R-002"
          statement: "GEPA whole-program output is pickle-backed"
          mitigation: "It stays production-excluded (product-posture.md, Current product baseline)"
        - id: "DSPX-R-003"
          statement: "The exact-fidelity template adapter path stays blocked on upstream issues"
          mitigation: "Provider-runtime v4 carries the supported local path (docs/system4d/fog.md)"
      exceptions:
        - id: "DSPX-E-INCIDENT"
          statement: "Incident hotfix allowed"
          reason: "Record Exception immediately and Debt immediately"
      debt:
        - id: "DSPX-D-001"
          statement: "The six deployed Soomfon voice buttons are not bound to commit, wheel, candidate, provider route, behavior or receipt truth"
          payoff_plan: "The next gap named in product-posture.md (Observed exit signals and next gap)"
        - id: "DSPX-D-002"
          statement: "99 Python files exceed the 500-line code budget; the largest is services/module_synthesis_evidence.py (5571 lines)"
          payoff_plan: "Split along seams when they are next touched"
        - id: "DSPX-D-003"
          statement: "Coverage floor is 64 percent (pyproject.toml fail_under)"
          payoff_plan: "Raise it only after a new full measurement (brownfield ratchet)"
        - id: "DSPX-D-004"
          statement: "docs/system4d/*.md were last updated 2026-02-28 and predate the DSPy 3.3 cutover (engine.md still cites 358+ tests)"
          payoff_plan: "Refresh them from product-posture.md when next touched"
